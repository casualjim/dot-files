<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
 <!-- Rendering: Chromium + Linux = better with light hinting -->
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
  <!-- Turn hinting back on (you can swap hintslight->hintnone if you insist) -->
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
  <edit mode="assign" name="rgba">
   <const>rgb</const>
  </edit>
  <edit mode="assign" name="lcdfilter">
   <const>lcddefault</const>
  </edit>
  <!-- Optional: keep bitmaps off -->
  <edit mode="assign" name="embeddedbitmap">
   <bool>true</bool>
  </edit>
 </match>
 <alias>
  <family>sans-serif</family>
  <prefer>
   <family>IBM Plex Sans</family>
   <family>Mona Sans</family>
   <family>Noto Sans</family>
  </prefer>
 </alias>
 <alias>
  <family>ui-sans-serif</family>
  <prefer>
   <family>IBM Plex Sans</family>
   <family>Mona Sans</family>
   <family>Noto Sans</family>
  </prefer>
 </alias>
 <alias>
  <family>serif</family>
  <prefer>
   <family>IBM Plex Serif</family>
   <family>Noto Serif</family>
  </prefer>
 </alias>
 <alias>
  <family>ui-serif</family>
  <prefer>
   <family>IBM Plex Serif</family>
   <family>Noto Serif</family>
  </prefer>
 </alias>
 <alias>
  <family>monospace</family>
  <prefer>
   <family>IBM Plex Mono</family>
   <family>Monaspace Neon Var</family>
   <family>Monaspace Neon NF</family>
   <family>Noto Sans Mono</family>
  </prefer>
 </alias>
  <!-- Mona Sans: optical sizing only. Appending fontfeatures (ss01 ss02) here hangs
      Ghostty at 100% CPU before it opens a window, so stylistic sets are set per app. -->
 <match target="font">
  <test compare="contains" name="family">
   <string>Mona Sans</string>
  </test>
  <edit mode="assign" name="font-optical-sizing">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <test compare="contains" name="family">
   <string>Monasp</string>
  </test>
  <edit mode="append" name="fontfeatures">
   <string>calt liga ss01 ss02 ss03 ss04 ss05 ss06</string>
  </edit>
  <edit mode="assign" name="embeddedbitmap">
   <bool>false</bool>
  </edit>
 </match>
 <match target="pattern">
  <edit mode="append" name="family">
   <string>Noto Sans Symbols2</string>
   <string>Noto Color Emoji</string>
   <string>Noto Emoji</string>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>rgb</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
</fontconfig>
