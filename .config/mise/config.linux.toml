# Any Linux, headless or desktop (loaded automatically on Linux; macOS never sees it). Desktop-only things
# are in config.desktop.toml.
[env]
# Docker API clients (compose, testcontainers) talk to the rootless podman socket.
DOCKER_HOST = "unix://{{env.XDG_RUNTIME_DIR}}/podman/podman.sock"

[bootstrap.hooks]
post-dotfiles = "systemctl --user daemon-reload"

[dotfiles]
"~/.config/noctalia/update-adapters/dotfiles/adapter.json" = {}
"~/.local/bin/dotfiles-update" = {}
"~/.local/bin/dotfiles-update-check" = {}
"~/.local/bin/dotfiles-update-launch" = {}
"~/.config/systemd/user/codebase-memory-mcp.service" = { mode = "copy" }
# Quadlet: podman generates headroom.service from it (volume dir is declared in mise.linux.toml).
"~/.config/containers/systemd/headroom.container" = { mode = "copy" }
"~/.config/containers/systemd/otel-desktop-viewer.container" = { mode = "copy" }
# Edits made to copy-mode dotfiles (by apps, in the live file) are carried back into this repo.
"~/.config/systemd/user/dotfiles-sync-back.service" = { mode = "copy" }
"~/.local/bin/dotfiles-sync-back" = { mode = "copy" }
# gpg-agent is unlocked at login from a TPM-sealed credential; the YubiKey drill is a monthly reminder.
"~/.config/systemd/user/gpg-agent-pass.service" = { mode = "copy" }
"~/.config/systemd/user/yubikey-drill.service" = { mode = "copy" }
"~/.config/systemd/user/yubikey-drill.timer" = { mode = "copy" }
"~/.local/bin/gpg-agent-pass" = { mode = "copy" }
"~/.local/bin/yubikey-drill" = { mode = "copy" }
# Linux-only git credential helper for the Gitea host, via the `gt` CLI (package gitea-cli).
# It lives in os.gitconfig, which ~/.config/git/config includes. macOS gets its own version of
# that file from config.macos.toml.
"~/.config/git/os.gitconfig" = { content = "[credential \"https://code.lotsa.ai\"]\n\tuseHttpPath = true\n\thelper =\n\thelper = !GITEA_CLI_CONFIG_DIR=$HOME/.config/gitea-cli /usr/bin/gt auth git-credential --host https://code.lotsa.ai\n" }
