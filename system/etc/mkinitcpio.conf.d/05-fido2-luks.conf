# systemd-based initrd with the sd-encrypt hook, so LUKS can be unlocked with a
# FIDO2 token (hmac-secret). `keyboard` comes before `autodetect` on purpose: it makes
# the initrd carry all keyboard drivers, so a keyboard behind a USB hub works at the
# LUKS prompt. Named 05- so it sorts BEFORE 10-limine-snapper-sync.conf, which appends
# sd-btrfs-overlayfs with HOOKS+=(...): a later file that assigned HOOKS would drop it.
# Rebuild with: sudo mkinitcpio -P && sudo limine-update
HOOKS=(base systemd keyboard autodetect microcode kms modconf block sd-vconsole plymouth sd-encrypt filesystems)
