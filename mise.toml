# Provisioning for every machine this repo sets up. This file holds only what works on macOS AND Linux;
# the rest is split by what the machine is, in files that sit next to this one:
#
#   mise.linux.toml    any Linux (loaded automatically): TPM/YubiKey/gpg/gopass, podman, polkit and PAM
#   mise.arch.toml     Arch and CachyOS, headless or desktop: the pacman/aur package names
#   mise.desktop.toml  a machine with a desktop (CachyOS + niri + Noctalia): the session, apps, AppImages
#   (mise.ubuntu.toml  will hold the apt equivalents when an Ubuntu box needs them)
#
# arch, ubuntu and desktop are config environments that mise cannot detect by itself: pick them per
# machine with `mise run set-env arch desktop` (writes ~/.config/mise/miserc.local.toml, not in the repo).
# The same split exists for the global config in ~/.config/mise/ (config.linux.toml, config.desktop.toml).
#
# Global tools and the [dotfiles] table live in ~/.config/mise/config.toml.
# Run from this directory (after `mise trust`):
#   mise bootstrap --dry-run     preview everything
#   mise bootstrap               apply
#   mise tasks                   one-off, interactive steps (hardware, logins, secrets)

# ---------------------------------------------------------------------------
# Checks and git hooks (hk). Config in hk.pkl; run everything with `mise run check`.
# ---------------------------------------------------------------------------
[tools]
# Keep this equal to the version in the URLs at the top of hk.pkl.
hk = "2.12.0"
betterleaks = "latest"
taplo = "latest"
shellcheck = "latest"
rumdl = "latest"
oxlint = "latest"
oxfmt = "latest"

# ---------------------------------------------------------------------------
# Steps that work the same everywhere
# ---------------------------------------------------------------------------
# zage keeps its aliases in ~/.config/zage/aliases (ZAGE_ALIAS_FILE in the global config). The file is yours and not in
# this repo; only the directory is created, so zage has somewhere to write it.
[bootstrap.directories."~/.config/zage"]

# zage ships its own unit (`zage service install` writes zage.socket and zage.service),
# so mise only keeps the state. Run `mise run zage-install` once before the first apply.
[tasks.zage-install]
description = "Write zage's systemd user units (Linux) or launchd agent (macOS)"
run = "zage service install"

[tasks.check]
description = "Run every hk check on all files (the same checks as the git pre-commit hook)"
run = "hk check --all"

[tasks.hooks]
description = "Install hk's git hooks in this clone (they run for git commit; jj does not run git hooks)"
run = "hk install --mise"

[tasks.link-global-config]
description = "FIRST step on a new machine: link ~/.config/mise/config.toml to this repo's copy"
# mise cannot deploy the config that declares its own [dotfiles] table, so this one link
# is made by hand (or by this task). After it, `mise bootstrap` does the rest.
run = """
mkdir -p "$HOME/.config/mise"
ln -sf "$MISE_PROJECT_ROOT/.config/mise/config.toml" "$HOME/.config/mise/config.toml"
"""

[tasks.set-env]
description = "Say what this machine is: mise run set-env arch desktop fprint (or just arch, or ubuntu). Run it before the first bootstrap"
# arch, ubuntu, desktop and fprint cannot be detected, so they are a per-machine choice that stays out of the repo.
usage = 'arg "<env>" var=#true help="arch, ubuntu, desktop, fprint"'
shell = "bash -c"
run = '''
set -euo pipefail
mkdir -p "$HOME/.config/mise"
printf 'env = [%s]\n' "$(printf '"%s", ' $usage_env | sed 's/, $//')" > "$HOME/.config/mise/miserc.local.toml"
cat "$HOME/.config/mise/miserc.local.toml"
'''

[tasks.jj-identity]
description = "Set your jj name and email in ~/.config/jj/conf.d/10-user.toml (kept out of this public repo)"
run = """
mkdir -p "$HOME/.config/jj/conf.d"
touch "$HOME/.config/jj/conf.d/10-user.toml"
chmod 600 "$HOME/.config/jj/conf.d/10-user.toml"
printf 'jj user name: '; read -r name
printf 'jj user email: '; read -r email
jj config set --file "$HOME/.config/jj/conf.d/10-user.toml" user.name "$name"
jj config set --file "$HOME/.config/jj/conf.d/10-user.toml" user.email "$email"
"""

[tasks.git-identity]
description = "Set your git name and email in ~/.gitconfig (kept out of this public repo)"
run = """
printf 'git user name: '; read -r name
printf 'git user email: '; read -r email
git config --global user.name "$name"
git config --global user.email "$email"
"""

[tasks.helix-grammars]
description = "Fetch and build Helix's tree-sitter grammars into ~/.config/helix/runtime (slow; needs a C compiler)"
run = "hx --grammar fetch && hx --grammar build"

[tasks.bat-cache]
description = "Rebuild bat's theme cache after the Catppuccin themes change"
run = "bat cache --build"

[tasks.docker-credential-gopass]
description = "Build docker-credential-gopass from casualjim/docker-credential-helpers (branch mine) into ~/.local/bin"
shell = "bash -c"
run = '''
set -euo pipefail
# The fork keeps upstream's module path, so `go install` of the fork does not work; build from a clone.
src=$(mktemp -d)
trap 'rm -rf "$src"' EXIT
git clone --depth 1 --branch mine https://github.com/casualjim/docker-credential-helpers "$src"
cd "$src"
go build -trimpath -ldflags="-X github.com/docker/docker-credential-helpers/credentials.Name=docker-credential-gopass" -o "$HOME/.local/bin/docker-credential-gopass" ./gopass/cmd/
"$HOME/.local/bin/docker-credential-gopass" version
# Point Docker at the helper. Only credsStore is set; docker adds the auths entries itself on login.
mkdir -p "$HOME/.docker"
f="$HOME/.docker/config.json"
[[ -f $f ]] || echo "{}" > "$f"
jq '.credsStore = "gopass"' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
'''

# ---------------------------------------------------------------------------
# Coding agents: Hindsight and the code graph
# ---------------------------------------------------------------------------
# Tern, Claude Code, Codex and pi install and update themselves, and Tern also owns omp (see the README).
# What is here is what goes on top of them.
[tasks.hindsight-install]
description = "First time: add Hindsight to every coding agent it detects, then apply the pi-mimir patch"
shell = "bash -c"
run = '''
set -euo pipefail
mise run pi-mimir-sync
npx @vectorize-io/hindsight-coding-agents install all
mise run hindsight-patch
'''

[tasks.hindsight-update]
description = "Update Hindsight in place (a machine that already has it, or an rsynced one), then re-apply the pi-mimir patch"
shell = "bash -c"
run = '''
set -euo pipefail
mise run pi-mimir-sync
# The update re-stages ~/.hindsight/coding-agents and wipes the patch, so the patch always follows it.
npx @vectorize-io/hindsight-coding-agents update
mise run hindsight-patch
'''

[tasks.hindsight-patch]
description = "Apply pi-mimir's patch-dist.mjs to the staged Hindsight dist (idempotent; needed after every install or update)"
run = 'node "$HOME/github/casualjim/pi-mimir/packages/pi-hindsight/patch-dist.mjs"'

[tasks.pi-mimir-sync]
description = "Clone casualjim/pi-mimir into ~/github/casualjim/pi-mimir, or fast-forward it if it is already there"
shell = "bash -c"
run = '''
set -euo pipefail
dir="$HOME/github/casualjim/pi-mimir"
if [[ -d $dir/.git ]]; then
  git -C "$dir" pull --ff-only
else
  mkdir -p "$(dirname "$dir")"
  git clone https://github.com/casualjim/pi-mimir "$dir"
fi
'''

[tasks.codebase-memory-build]
description = "Pull and build DeusData/codebase-memory-mcp (with the UI) and install the binary into ~/.local/bin"
shell = "bash -c"
run = '''
set -euo pipefail
dir="$HOME/github/DeusData/codebase-memory-mcp"
if [[ -d $dir/.git ]]; then
  git -C "$dir" pull --ff-only
else
  mkdir -p "$(dirname "$dir")"
  git clone https://github.com/DeusData/codebase-memory-mcp "$dir"
fi
cd "$dir"
./scripts/build.sh --with-ui
# Every running process must be the same build, so stop the daemon before the binary changes. The copy goes
# through a temporary name and a rename: overwriting a running executable in place fails with "text file busy".
bin="$HOME/.local/bin/codebase-memory-mcp"
had_daemon=0
if [[ -x $bin ]] && systemctl --user is-active --quiet codebase-memory-mcp.service 2>/dev/null; then
  had_daemon=1
  systemctl --user stop codebase-memory-mcp.service
fi
mkdir -p "$HOME/.local/bin"
install -m 755 build/c/codebase-memory-mcp "$bin.new"
mv -f "$bin.new" "$bin"
if (( had_daemon )); then
  systemctl --user start codebase-memory-mcp.service
fi
"$bin" --version
'''

[tasks.codebase-memory-install]
description = "First time only: register codebase-memory-mcp with the coding agents it detects, with hooks"
depends = ["codebase-memory-build"]
run = "codebase-memory-mcp install -y --hooks"
