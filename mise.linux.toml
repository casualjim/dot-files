# Any Linux, headless or desktop (mise loads this file automatically on Linux; macOS never sees it).
# Distro-specific package names are in mise.arch.toml (and mise.ubuntu.toml); desktop things in mise.desktop.toml.

# /dev/tpmrm0 is group tss; the TPM-sealed credentials need it. mise.desktop.toml declares the same
# user with the input group added (voxtype), and that whole declaration wins on a desktop.
[bootstrap.users.ivan]
group = "ivan"
groups = ["tss"]

# polkit: let ivan's local session decrypt TPM-sealed credentials without a prompt.
[bootstrap.files."/etc/polkit-1/rules.d/49-keyring-unlock.rules"]
source = "./system/etc/polkit-1/rules.d/49-keyring-unlock.rules"
owner = "root"
group = "root"
mode = "0644"

# podman-docker: an empty marker file silences "Emulate Docker CLI using podman" on every call.
[bootstrap.files."/etc/containers/nodocker"]
content = ""
owner = "root"
group = "root"
mode = "0644"

[bootstrap.services.tailscaled]
state = "running"
enabled = true

# pcscd is socket-activated: the daemon starts on the first smart-card client.
[bootstrap.services."pcscd.socket"]
state = "running"
enabled = true

# Rootless podman API socket, socket-activated. Clients use
# DOCKER_HOST=unix://$XDG_RUNTIME_DIR/podman/podman.sock
[bootstrap.services."podman.socket"]
scope = "user"
state = "running"
enabled = true

# yubikey-drill.service and .timer are dotfiles; the timer opens a terminal when a drill is due.
[bootstrap.services."yubikey-drill.timer"]
scope = "user"
state = "running"
enabled = true

# dotfiles-sync-back.service is a dotfile; it copies live edits to copy-mode dotfiles back into the repo.
[bootstrap.services."dotfiles-sync-back.service"]
scope = "user"
state = "running"
enabled = true

# gpg-agent-pass.service is a dotfile; it presets the GPG passphrase at login from a TPM-sealed credential.
[bootstrap.services."gpg-agent-pass.service"]
scope = "user"
enabled = true

# zage ships its own unit (`zage service install` writes zage.socket and zage.service),
# so mise only keeps the state. Run `mise run zage-install` once before the first apply.
[bootstrap.services."zage.socket"]
scope = "user"
state = "running"
enabled = true

[tasks.seal-gpg]
description = "Seal your GPG passphrase to this machine's TPM so gpg-agent is unlocked at login (re-run after changing it)"
run = """
systemd-ask-password "GPG passphrase:" | tr -d '\\n' \\
  | systemd-creds encrypt --with-key=tpm2 --name=gpg - "$HOME/.config/gpg-unlock.cred"
chmod 600 "$HOME/.config/gpg-unlock.cred"
systemctl --user restart gpg-agent-pass.service
"""

[tasks.register-u2f]
description = "Register YubiKeys for pam_u2f (polkit prompts), one at a time. Any one registered key is enough to authenticate"
shell = "bash -c"
run = """
set -euo pipefail
f="$HOME/.config/Yubico/u2f_keys"
mkdir -p "$(dirname "$f")"
line=""
for name in "YubiKey Bio" "YubiKey 5C" "YubiKey NEO"; do
  read -r -p "Plug in ONLY the $name, then press Enter (s to skip): " answer
  [[ $answer == s ]] && continue
  echo "Touch the $name when it blinks."
  if [[ -z $line ]]; then
    line=$(pamu2fcfg -u "$USER")
  else
    line+=$(pamu2fcfg -n)
  fi
done
[[ -n $line ]] || { echo "No key registered; nothing written."; exit 1; }
printf "%s\\n" "$line" > "$f"
chmod 600 "$f"
echo "Wrote $f"
"""

[tasks.resolv-stub]
description = "Point /etc/resolv.conf at systemd-resolved's stub (needed for Tailscale MagicDNS)"
run = """
sudo ln -sf /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf
sudo systemctl restart NetworkManager
"""

[tasks.tailscale-up]
description = "Join the tailnet (opens a login URL)"
run = "sudo tailscale up --operator=$USER --accept-routes --accept-dns"


# headroom's state directory (the Quadlet in .config/containers/systemd mounts it at /data).
[bootstrap.directories."~/.local/state/headroom"]

# headroom.service is generated by podman from the headroom.container Quadlet. A generated unit reports "generated"
# and cannot be enabled, so mise's default enabled = true would make the entry "unknown" and the bootstrap refuse
# it. Its [Install] section already wires it to login; mise only keeps it running.
[bootstrap.services."headroom.service"]
scope = "user"
state = "running"
enabled = false

# AutoUpdate=registry in the headroom Quadlet does nothing by itself; this timer (shipped with podman) runs
# `podman auto-update` daily, which pulls newer images for labelled containers and restarts their units.
[bootstrap.services."podman-auto-update.timer"]
scope = "user"
state = "running"
enabled = true

# codebase-memory-mcp.service is a dotfile; it starts the daemon at login once the binary is installed
# (`mise run codebase-memory-build`).
[bootstrap.services."codebase-memory-mcp.service"]
scope = "user"
enabled = true

[tasks.update]
description = "Update outdated packages, tools, containers, plugins and source builds"
raw = true
run = 'python3 "$MISE_PROJECT_ROOT/.local/bin/dotfiles-update"'

